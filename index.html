<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI VISION - Pro Detection | ATUL PAUL</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

  <style>
    /* --- 1. Core Aesthetics & Animated Background --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      /* Dynamic Gradient Animation */
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #020024);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Typography & Neon Effects */
    h1,
    .logo,
    button {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
    }

    .neon-text-blue {
      color: #00f3ff;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.5);
    }

    .neon-text-pink {
      color: #ff0055;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.7), 0 0 20px rgba(255, 0, 85, 0.5);
    }

    /* --- 2. Glassmorphism Navbar --- */
    .navbar {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .logo i {
      margin-right: 10px;
    }

    /* --- 3. Main Interface (Glass Card) --- */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      /* Ultra transparent */
      backdrop-filter: blur(20px);
      /* Strong blur effect */
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      width: 100%;
      max-width: 750px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .glass-panel:hover {
      border-color: rgba(0, 243, 255, 0.3);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #a0a0a0;
      margin-bottom: 25px;
      font-size: 0.9rem;
    }

    #status {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(0, 243, 255, 0.1);
      border-radius: 50px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      margin-bottom: 20px;
      border: 1px solid rgba(0, 243, 255, 0.3);
    }

    /* --- 4. Sci-fi Video Area & Scanning Animation --- */
    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 15px;
      overflow: hidden;
      /* Initial Blue Neon Glow */
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
      border: 2px solid rgba(0, 243, 255, 0.4);
      background: #000;
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    video {
      width: 100%;
      height: auto;
      display: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* The Scanning Line */
    .scan-line {
      position: absolute;
      width: 100%;
      height: 3px;
      background: rgba(0, 243, 255, 0.8);
      box-shadow: 0 0 15px rgba(0, 243, 255, 1);
      top: 0;
      left: 0;
      z-index: 5;
      animation: scanAnim 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      display: none;
      /* Hidden initially */
    }

    @keyframes scanAnim {
      0% {
        top: 0;
        opacity: 0;
      }

      25% {
        opacity: 1;
      }

      75% {
        opacity: 1;
      }

      100% {
        top: 100%;
        opacity: 0;
      }
    }

    .placeholder-icon {
      font-size: 5rem;
      color: rgba(255, 255, 255, 0.1);
      animation: pulseIcon 3s infinite ease-in-out;
    }

    @keyframes pulseIcon {
      0% {
        opacity: 0.3;
        scale: 1;
      }

      50% {
        opacity: 0.6;
        scale: 1.05;
      }

      100% {
        opacity: 0.3;
        scale: 1;
      }
    }


    /* --- 5. Futuristic Buttons --- */
    .controls {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 35px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
    }

    #startBtn {
      background: transparent;
      color: #00f3ff;
      border: 2px solid #00f3ff;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    #startBtn:hover {
      background: #00f3ff;
      color: #000;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
      transform: translateY(-2px);
    }

    #stopBtn {
      background: transparent;
      color: #ff0055;
      border: 2px solid #ff0055;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
      display: none;
    }

    #stopBtn:hover {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none !important;
    }


    /* --- Footer --- */
    footer {
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(5px);
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.6rem;
      }

      .glass-panel {
        padding: 20px;
        width: 95%;
      }

      .navbar {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="logo neon-text-blue"><i class="fas fa-robot"></i> AI VISION SYSTEM</div>
    <div style="opacity: 0.7;"><i class="fas fa-network-wired"></i> v2.0</div>
  </nav>

  <main class="main-container">
    <div class="glass-panel">
      <h1><span class="neon-text-pink">NO PHONE</span> ZONE</h1>
      <p class="subtitle">Real-time autonomous detection powered by TensorFlow.js</p>

      <div id="status">
        <i class="fas fa-circle-notch fa-spin"></i> Initializing Neural Network...
      </div>

      <div class="video-wrapper">
        <div class="scan-line" id="scanLine"></div>

        <div id="placeholder" class="placeholder-icon">
          <i class="fas fa-camera-retro"></i>
        </div>

        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
      </div>

      <div class="controls">
        <button id="startBtn" onclick="startCamera()" disabled>
          INITIALIZE SYSTEM
        </button>
        <button id="stopBtn" onclick="stopCamera()">
          TERMINATE SCAN
        </button>
      </div>
    </div>
  </main>

  <audio id="alertSound" src="audio.mp3"></audio>

  <footer>
    <p>© 2026 Atul Paul | Advanced AI Project</p>
  </footer>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const placeholder = document.getElementById('placeholder');
    const scanLine = document.getElementById('scanLine');
    const alertSound = document.getElementById('alertSound');
    const videoWrapper = document.querySelector('.video-wrapper');

    let model = undefined;
    let stream = null;
    let isDetecting = false;
    let lastAlertTime = 0;

    // 1. Load Model
    cocoSsd.load().then(loadedModel => {
      model = loadedModel;
      statusText.innerHTML = '<i class="fas fa-check-circle" style="color:#00f3ff"></i> AI Model Ready. Awaiting Input.';
      statusText.style.borderColor = "rgba(0, 243, 255, 0.5)";
      startBtn.disabled = false;
    }).catch(err => {
      statusText.innerHTML = '<i class="fas fa-times-circle" style="color:#ff0055"></i> Model Failed to Load.';
      console.error("Model Load Error:", err);
    });

    // 2. Start Camera
    async function startCamera() {
      statusText.innerHTML = '<i class="fas fa-cog fa-spin"></i> Accessing Optical Sensors...';
      startBtn.disabled = true;

      try {
        // Universal camera constraints
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
          placeholder.style.display = 'none';
          video.style.display = "block";
          scanLine.style.display = "block"; // Activate scanning animation
          video.play();

          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          startBtn.style.display = 'none';
          stopBtn.style.display = 'inline-block';
          statusText.innerHTML = '<i class="fas fa-satellite-dish" style="color:#00f3ff"></i> Scanning Active. Monitoring Sector.';

          isDetecting = true;
          detectFrame();
        };
      } catch (err) {
        console.error("Camera Error:", err);
        statusText.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#ff0055"></i> Sensor Access Denied.';
        statusText.style.borderColor = "#ff0055";
        startBtn.disabled = false;
        alert("Could not access camera. Please check browser permissions.");
      }
    }

    // 3. Stop Camera
    function stopCamera() {
      isDetecting = false;
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
      // Reset UI
      video.style.display = "none";
      scanLine.style.display = "none";
      placeholder.style.display = "block";
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      startBtn.style.display = 'inline-block';
      startBtn.disabled = false;
      stopBtn.style.display = 'none';
      statusText.innerHTML = '<i class="fas fa-pause-circle"></i> System Terminated.';
      statusText.style.borderColor = "rgba(255, 255, 255, 0.3)";

      // Reset border glow
      videoWrapper.style.boxShadow = "0 0 25px rgba(0, 243, 255, 0.2)";
      videoWrapper.style.borderColor = "rgba(0, 243, 255, 0.4)";
    }

    // 4. Detection Loop
    function detectFrame() {
      if (!isDetecting) return;

      model.detect(video).then(predictions => {
        if (!isDetecting) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let phoneFound = false;

        predictions.forEach(prediction => {
          if (prediction.class === 'cell phone') {
            phoneFound = true;
            const [x, y, width, height] = prediction.bbox;

            // Futuristic Box Style (Neon Pink)
            ctx.strokeStyle = "#ff0055";
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 5]); // Dashed cyberpunk line
            ctx.strokeRect(x, y, width, height);
            ctx.setLineDash([]); // Reset dash

            // Label Background
            ctx.fillStyle = "rgba(255, 0, 85, 0.8)";
            ctx.fillRect(x, y - 30, width, 30);

            // Label Text
            ctx.font = "bold 14px Orbitron";
            ctx.fillStyle = "#fff";
            ctx.fillText("⚠️ TARGET: PHONE", x + 10, y - 10);
          }
        });

        // Visual & Audio Feedback on Detection
        if (phoneFound) {
          const now = Date.now();
          if (now - lastAlertTime > 3000) {
            alertSound.play().catch(() => { });
            lastAlertTime = now;
          }
          // Change border to Danger Red/Pink
          videoWrapper.style.boxShadow = "0 0 40px rgba(255, 0, 85, 0.7)";
          videoWrapper.style.borderColor = "#ff0055";
        } else {
          // Revert to Passive Blue
          videoWrapper.style.boxShadow = "0 0 25px rgba(0, 243, 255, 0.2)";
          videoWrapper.style.borderColor = "rgba(0, 243, 255, 0.4)";
        }

        requestAnimationFrame(detectFrame);
      });
    }
  </script>
</body>

</html>
